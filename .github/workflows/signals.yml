name: signals
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: signals-single
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TOKEN_SIGNALS }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_REPO: Mbms-1356/site-bot
      CHALLENGE_NAMESPACE: signals
      CHALLENGE_STATE_FILE: challenge_state_signals.json
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install pyTelegramBotAPI yt-dlp requests edge-tts
      - name: run bot
        run: |
          set +e
          timeout 240 python3 bot.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
