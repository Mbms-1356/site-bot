name: content-agent
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: content-agent-single
  cancel-in-progress: false
jobs:
  publish-content:
    runs-on: ubuntu-latest
    env:
      TOKEN_CONTENT_AGENT: ${{ secrets.TOKEN_CONTENT_AGENT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      CONTENT_ADMIN_CHAT_ID: ${{ secrets.CONTENT_ADMIN_CHAT_ID }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-fas >/dev/null 2>&1
          python3 -m pip install --quiet edge-tts pypdf PyJWT cryptography
      - name: Process Base channel content
        run: python3 content_agent.py
