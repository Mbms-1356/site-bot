name: content-agent
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  publish-content:
    runs-on: ubuntu-latest
    env:
      TOKEN_CONTENT_AGENT: ${{ secrets.TOKEN_CONTENT_AGENT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          sudo apt-get install -y ffmpeg >/dev/null 2>&1
          python3 -m pip install --quiet edge-tts pypdf
      - name: Process Base channel content
        run: python3 content_agent.py
