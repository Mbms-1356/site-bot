name: content-agent
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: content-agent-single
  cancel-in-progress: false
jobs:
  publish-content:
    runs-on: ubuntu-latest
    env:
      TOKEN_CONTENT_AGENT: ${{ secrets.TOKEN_CONTENT_AGENT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      CONTENT_ADMIN_CHAT_ID: ${{ secrets.CONTENT_ADMIN_CHAT_ID }}
      GITHUB_APP_ID: ${{ secrets.APP_ID_2026 }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID_2026 }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY_2026 }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID_2026 }}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON_2026 }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-content-agent-v2-${{ hashFiles('requirements.txt') }}
      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v tesseract >/dev/null 2>&1; then
            timeout 120 sudo apt-get update -y >/dev/null 2>&1 || echo 'apt update timed out; continuing with available tools'
            timeout 120 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-fas >/dev/null 2>&1 || echo 'media tools unavailable; OCR/reel steps will degrade gracefully'
          fi
          python3 -m pip install --quiet edge-tts pypdf Pillow PyJWT cryptography google-api-python-client google-auth
      - name: Process Base channel content
        run: |
          set +e
          timeout 240 python3 content_agent.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
