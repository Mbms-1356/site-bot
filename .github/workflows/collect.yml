name: collect
on:
  workflow_dispatch:
  repository_dispatch:
    types: [collect]
  schedule:
    - cron: '0 6 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      TOKEN: ${{ secrets.TOKEN_AGENT }}
    steps:
      - name: research
        run: |
          python3 - <<'PYEND'
          import json,os,re,urllib.request as ur,urllib.parse as up,traceback,base64,html as H
          PAT=os.environ.get('GH_PAT','');OR=os.environ.get('OPENROUTER_KEY','');GK=os.environ.get('GROQ_KEY','')
          API='https://api.telegram.org/bot'+os.environ['TOKEN']
          errs=[]
          def tell(t):
              try:ur.urlopen(ur.Request(API+'/sendMessage',data=json.dumps({'chat_id':'227491135','text':t}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              except Exception:pass
          def get(u,t=30):return ur.urlopen(ur.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read().decode('utf-8','ignore')
          def clean(x):return H.unescape(re.sub('<[^>]+>','',x)).strip()
          titles=[];links=[]
          for fd in ['https://www.babypips.com/feed','https://www.dailyfx.com/feed','https://forexlive.com/feed']:
              try:
                  x=get(fd,20);ts=re.findall(r'<title>(.*?)</title>',x);titles+=[clean(t) for t in ts[1:6]]
              except Exception:pass
          try:
              x=get('https://news.google.com/rss/search?q=forex+trading+OR+gold+price&hl=en-US&gl=US&ceid=US:en',20)
              for t,l in re.findall(r'<item><title>(.*?)</title>\s*<link>(.*?)</link>',x,re.S)[:6]:
                  titles.append(clean(t));links.append(l)
          except Exception:pass
          try:
              j=json.loads(get('https://hn.algolia.com/api/v1/search?query=forex&tags=story',15))
              titles+=[h.get('title','') for h in j.get('hits',[]) if h.get('title')][:8]
          except Exception:pass
          for ch in ['cointelegraph','fxstreet']:
              try:
                  h=get('https://t.me/s/'+ch,20)
                  titles+=[clean(t) for t in re.findall(r'tgme_widget_message_text[^>]*>(.*?)</div>',h,re.S) if len(clean(t))>30][:5]
              except Exception:pass
          # Jina deep-read: متن کامل ۲ مقالهٔ اول
          for l in links[:2]:
              try:
                  md=get('https://r.jina.ai/'+l,25)
                  md=re.sub(r'\s+',' ',md)
                  titles.append('DEEP: '+md[:400])
              except Exception:pass
          titles=[t for t in titles if len(t)>15][:30]
          prompt='عنوان/متن‌های جهانی دربارهٔ فارکس/طلا/پول هوشمند: '+' | '.join(titles)+' خروجی فقط JSON آرایه بدون متن دیگر: [{"t":"موضوع فارسی کوتاه","f":"نکتهٔ آموزشی فارسی یک‌خطی","h":"قلاب فارسی جذاب"}] حداقل ۶ مورد.'
          def parse(txt):
              out=[]
              txt=txt.replace('```json','').replace('```','')
              i=txt.find('[');j=txt.rfind(']')
              if i>=0 and j>i:
                  try:
                      for o in json.loads(txt[i:j+1]):
                          if isinstance(o,dict) and o.get('t'):out.append(o)
                  except Exception:pass
              if not out:
                  for m in re.findall(r'\{[^{}]{10,300}\}',txt):
                      try:
                          o=json.loads(m)
                          if o.get('t'):out.append(o)
                      except Exception:pass
              return out
          models=[]
          if OR:
              try:
                  ml=json.loads(get('https://openrouter.ai/api/v1/models',20))
                  free=[m.get('id','') for m in ml.get('data',[]) if m.get('pricing',{}).get('prompt')=='0' and m.get('pricing',{}).get('completion')=='0']
                  pref=[m for m in free if any(k in m.lower() for k in ['qwen','llama','mistral','deepseek','gemini','alpha'])]
                  models=(pref or free)[:3]
              except Exception as e:
                  errs.append('list:'+str(e)[:40])
          new=[];ai_used='none'
          if titles and models:
              for m in models:
                  try:
                      body=json.dumps({'model':m,'messages':[{'role':'user','content':prompt}]}).encode()
                      r=ur.urlopen(ur.Request('https://openrouter.ai/api/v1/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+OR,'User-Agent':'forexin'}),timeout=60).read().decode()
                      new=parse(json.loads(r)['choices'][0]['message']['content'])
                      if new:ai_used='openrouter:'+m.split('/')[-1];break
                  except Exception as e:
                      errs.append('or:'+str(e)[:35])
          if not new and titles and GK:
              try:
                  body=json.dumps({'model':'llama-3.1-8b-instant','messages':[{'role':'user','content':prompt}]}).encode()
                  r=ur.urlopen(ur.Request('https://api.groq.com/openai/v1/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+GK}),timeout=60).read().decode()
                  new=parse(json.loads(r)['choices'][0]['message']['content'])
                  if new:ai_used='groq'
              except Exception as e:
                  errs.append('groq:'+str(e)[:35])
          if not new and titles:
              for t in titles[:6]:
                  if len(t)>10 and not t.startswith('DEEP'):new.append({'t':clean(t)[:60],'f':'این مفهوم در متد LIT بررسی می‌شود','h':'قبل از هر ترید این را ببین'})
              if new:ai_used='fallback'
          committed=False;added=0
          if new and PAT:
              try:
                  vault={'principles':[],'quotes':[],'hooks':[],'lit_facts':[]}
                  try:vault.update(json.loads(get('https://mbms-1356.github.io/forexin-site-/vault.json',15)))
                  except Exception:pass
                  for it in new:
                      if it.get('t') and it['t'] not in vault['principles']:vault['principles'].append(it['t']);added+=1
                      if it.get('f') and it['f'] not in vault['lit_facts']:vault['lit_facts'].append(it['f'])
                      if it.get('h') and it['h'] not in vault['hooks']:vault['hooks'].append(it['h'])
                  for k in vault:vault[k]=vault[k][-80:]
                  body={'message':'vault auto-enrich','content':base64.b64encode(json.dumps(vault,ensure_ascii=False).encode()).decode()}
                  try:
                      old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',15))
                      body['sha']=old.get('sha')
                  except Exception:pass
                  ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'studio','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
                  committed=True
              except Exception as e:
                  errs.append('commit:'+str(e)[:80])
          tell('🔭 تانکر۷: عناوین '+str(len(titles))+' (عمیق:'+str(len(links[:2]))+') | AI '+ai_used+' → '+str(len(new))+' | مخزن +'+str(added if committed else 0)+(' | '+';'.join(errs)[:150] if errs else ''))
          print('done',ai_used,len(new),committed)
          PYEND
