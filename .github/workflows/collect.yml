name: collect
on:
  workflow_dispatch:
  repository_dispatch:
    types: [collect]
  schedule:
    - cron: '0 6 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN: "8672154032:AAEgSGwR7uXGZsdpxNJvgsXswJ4aHoAYzhE"
    steps:
      - name: research
        run: |
          python3 - <<'PYEND'
          import json,os,re,urllib.request as ur,urllib.parse as up,traceback,base64
          PAT=os.environ.get('GH_PAT','')
          API='https://api.telegram.org/bot'+os.environ['TOKEN']
          def tell(t):
              try:ur.urlopen(ur.Request(API+'/sendMessage',data=json.dumps({'chat_id':'227491135','text':t}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              except Exception:pass
          def get(u,t=30):return ur.urlopen(ur.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read().decode('utf-8','ignore')
          titles=[]
          for sub in ['Forex','Daytrading','SmartMoneyConcepts']:
              try:
                  rj=json.loads(get('https://www.reddit.com/r/'+sub+'/hot.json?limit=8',15))
                  titles+=[c['data']['title'] for c in rj['data']['children']]
              except Exception:pass
          for sub in ['Forex']:
              try:
                  rj=json.loads(get('https://www.reddit.com/r/'+sub+'/top.json?t=week&limit=10',15))
                  titles+=[c['data']['title'] for c in rj['data']['children']]
              except Exception:pass
          for q in ['liquidity inducement trading','smart money concepts order block','forex market structure CHoCH','trading psychology discipline']:
              try:
                  h=get('https://html.duckduckgo.com/html/?q='+up.quote(q),20)
                  titles+=re.findall(r'result__a[^>]*>(.*?)</a>',h)[:5]
              except Exception:pass
          titles=[re.sub('<[^>]+>','',t).strip() for t in titles if len(t)>15][:25]
          prompt='این عنوان‌های جهانی دربارهٔ فارکس و پول هوشمند است: '+' | '.join(titles)+' خروجی فقط JSON آرایه بدون توضیح: [{"t":"موضوع فارسی کوتاه","f":"نکتهٔ آموزشی فارسی یک‌خطی","h":"قلاب فارسی جذاب"}] حداقل ۶ مورد.'
          new=[]
          def try_ai(url,headers,body):
              r=ur.urlopen(ur.Request(url,data=body,headers=headers),timeout=60).read().decode('utf-8','ignore')
              j=json.loads(r)
              return j['choices'][0]['message']['content']
          if titles:
              for attempt in range(2):
                  try:
                      if attempt==0:
                          txt=try_ai('https://models.inference.ai.azure.com/chat/completions',{'Content-Type':'application/json','Authorization':'Bearer '+PAT},json.dumps({'model':'gpt-4o-mini','messages':[{'role':'user','content':prompt}],'temperature':0.7}).encode())
                      else:
                          txt=try_ai('https://text.pollinations.ai/',{'Content-Type':'application/json'},json.dumps({'messages':[{'role':'user','content':prompt}],'model':'openai'}).encode())
                      txt=txt.replace('```json','').replace('```','')
                      i=txt.find('[');j=txt.rfind(']')
                      new=json.loads(txt[i:j+1])
                      break
                  except Exception:pass
          committed=False
          if new and PAT:
              try:
                  vault={'principles':[],'quotes':[],'hooks':[],'lit_facts':[]}
                  try:vault.update(json.loads(get('https://mbms-1356.github.io/forexin-site-/vault.json',15)))
                  except Exception:pass
                  for it in new:
                      if it.get('t') and it['t'] not in vault['principles']:vault['principles'].append(it['t'])
                      if it.get('f') and it['f'] not in vault['lit_facts']:vault['lit_facts'].append(it['f'])
                      if it.get('h') and it['h'] not in vault['hooks']:vault['hooks'].append(it['h'])
                  for k in vault:vault[k]=vault[k][-60:]
                  body={'message':'vault auto-enrich','content':base64.b64encode(json.dumps(vault,ensure_ascii=False).encode()).decode()}
                  try:
                      old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',15))
                      body['sha']=old.get('sha')
                  except Exception:pass
                  ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'studio','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
                  committed=True
              except Exception:pass
          tell('🔭 پژوهشگر: عناوین پیدا شده: '+str(len(titles))+' | موارد جدید افزوده به مخزن: '+str(len(new) if committed else 0))
          print('done',len(titles),len(new),committed)
          PYEND
