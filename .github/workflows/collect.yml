name: collect
on:
  workflow_dispatch:
  repository_dispatch:
    types: [collect]
  schedule:
    - cron: '0 6 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN: "8672154032:AAEgSGwR7uXGZsdpxNJvgsXswJ4aHoAYzhE"
    steps:
      - name: research
        run: |
          python3 - <<'PYEND'
          import json,os,re,urllib.request as ur,urllib.parse as up,traceback,base64,html as H
          PAT=os.environ.get('GH_PAT','')
          API='https://api.telegram.org/bot'+os.environ['TOKEN']
          errs=[];src_used=[]
          def tell(t):
              try:ur.urlopen(ur.Request(API+'/sendMessage',data=json.dumps({'chat_id':'227491135','text':t}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              except Exception:pass
          def get(u,t=30):return ur.urlopen(ur.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read().decode('utf-8','ignore')
          def clean(x):return H.unescape(re.sub('<[^>]+>','',x)).strip()
          titles=[]
          for fd in ['https://www.babypips.com/feed','https://www.dailyfx.com/feed','https://forexlive.com/feed']:
              try:
                  x=get(fd,20);ts=re.findall(r'<title>(.*?)</title>',x);titles+=[clean(t) for t in ts[1:6]];src_used.append(fd.split('/')[2])
              except Exception:pass
          try:
              x=get('https://news.google.com/rss/search?q=forex+trading+OR+gold+price&hl=en-US&gl=US&ceid=US:en',20)
              titles+=[clean(t) for t in re.findall(r'<item><title>(.*?)</title>',x)[:10]];src_used.append('gnews')
          except Exception:pass
          try:
              j=json.loads(get('https://hn.algolia.com/api/v1/search?query=forex&tags=story',15))
              titles+=[h.get('title','') for h in j.get('hits',[]) if h.get('title')][:8];src_used.append('hn')
          except Exception:pass
          for ch in ['cointelegraph','fxstreet']:
              try:
                  h=get('https://t.me/s/'+ch,20)
                  titles+=[clean(t) for t in re.findall(r'tgme_widget_message_text[^>]*>(.*?)</div>',h,re.S) if len(clean(t))>30][:5];src_used.append(ch)
              except Exception:pass
          titles=[t for t in titles if len(t)>15][:30]
          prompt='عنوان‌های جهانی دربارهٔ فارکس/طلا/پول هوشمند: '+' | '.join(titles)+' خروجی فقط JSON آرایه بدون هیچ متن دیگر: [{"t":"موضوع فارسی کوتاه","f":"نکتهٔ آموزشی فارسی یک‌خطی","h":"قلاب فارسی جذاب"}] حداقل ۶ مورد.'
          new=[];ai_used='none'
          def parse(txt):
              out=[]
              txt=txt.replace('```json','').replace('```','')
              i=txt.find('[');j=txt.rfind(']')
              if i>=0 and j>i:
                  try:
                      arr=json.loads(txt[i:j+1])
                      for o in arr:
                          if isinstance(o,dict) and o.get('t'):out.append(o)
                  except Exception:pass
              if not out:
                  for m in re.findall(r'\{[^{}]{10,300}\}',txt):
                      try:
                          o=json.loads(m)
                          if o.get('t'):out.append(o)
                      except Exception:pass
              return out
          if titles:
              # Try 1: GitHub Models with correct endpoint
              if PAT:
                  try:
                      body=json.dumps({'model':'gpt-4o-mini','messages':[{'role':'user','content':prompt}],'temperature':0.7}).encode()
                      r=ur.urlopen(ur.Request('https://models.github.ai/inference/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+PAT,'User-Agent':'n8n'}),timeout=60).read().decode()
                      j=json.loads(r);txt=j['choices'][0]['message']['content']
                      new=parse(txt)
                      if new:ai_used='github_models'
                  except Exception as e:
                      errs.append('gh:'+str(e)[:50])
              # Try 2: Pollinations GET (anonymous)
              if not new:
                  try:
                      url='https://text.pollinations.ai/'+up.quote(prompt[:1500])
                      txt=get(url,60)
                      new=parse(txt)
                      if new:ai_used='pollinations_get'
                  except Exception as e:
                      errs.append('poll:'+str(e)[:50])
              # Try 3: Pollinations POST with model specified
              if not new:
                  try:
                      body=json.dumps({'messages':[{'role':'user','content':prompt}],'model':'openai','private':False}).encode()
                      r=ur.urlopen(ur.Request('https://text.pollinations.ai/',data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'}),timeout=60).read().decode('utf-8','ignore')
                      new=parse(r)
                      if new:ai_used='pollinations_post'
                  except Exception as e:
                      errs.append('poll2:'+str(e)[:50])
              # Fallback 4: Build from titles ourselves (no AI)
              if not new:
                  new=[]
                  for t in titles[:8]:
                      if len(t)>10:
                          new.append({'t':clean(t)[:60],'f':'این مفهوم در متد LIT بررسی می‌شود','h':'قبل از هر ترید این را ببین'})
                  if new:ai_used='fallback_titles'
          committed=False
          if new and PAT:
              try:
                  vault={'principles':[],'quotes':[],'hooks':[],'lit_facts':[]}
                  try:vault.update(json.loads(get('https://mbms-1356.github.io/forexin-site-/vault.json',15)))
                  except Exception:pass
                  added=0
                  for it in new:
                      if it.get('t') and it['t'] not in vault['principles']:vault['principles'].append(it['t']);added+=1
                      if it.get('f') and it['f'] not in vault['lit_facts']:vault['lit_facts'].append(it['f'])
                      if it.get('h') and it['h'] not in vault['hooks']:vault['hooks'].append(it['h'])
                  for k in vault:vault[k]=vault[k][-80:]
                  body={'message':'vault auto-enrich','content':base64.b64encode(json.dumps(vault,ensure_ascii=False).encode()).decode()}
                  try:
                      old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',15))
                      body['sha']=old.get('sha')
                  except Exception:pass
                  ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/vault.json',data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'studio','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
                  committed=True
              except Exception as e:
                  errs.append('commit:'+str(e)[:80])
          tell('🔭 تانکر: عناوین '+str(len(titles))+' | AI '+ai_used+' → استخراج '+str(len(new))+' | به مخزن '+str(added if committed else 0)+(' | خطا: '+';'.join(errs)[:200] if errs else ''))
          print('done',ai_used,len(titles),len(new),committed)
          PYEND
