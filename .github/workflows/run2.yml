name: run2
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: run2-single
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_SITE_BOT_TOKEN: ${{ secrets.TELEGRAM_SITE_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_REPO: Mbms-1356/site-bot
      CHALLENGE_NAMESPACE: site
      CHALLENGE_STATE_FILE: challenge_state_site.json
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install pyTelegramBotAPI yt-dlp requests edge-tts >/dev/null 2>&1
      - name: run bot2
        run: |
          set +e
          timeout 240 python3 bot2.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
