name: run2
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
concurrency:
  group: run2-single
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_SITE_BOT_TOKEN: ${{ secrets.TELEGRAM_SITE_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_REPO: Mbms-1356/site-bot
      CHALLENGE_NAMESPACE: site
      CHALLENGE_STATE_FILE: challenge_state_site.json
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install pyTelegramBotAPI yt-dlp requests edge-tts >/dev/null 2>&1
      - name: run bot2
        run: python3 bot2.py
