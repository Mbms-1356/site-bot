name: pdfimg
on: [workflow_dispatch]
jobs:
  x:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN_AGENT: ${{ secrets.TOKEN_AGENT }}
    steps:
      - run: |
          pip install pypdf pillow >/dev/null 2>&1
          python3 - <<'PY'
          import io,urllib.request as ur,urllib.parse as up,base64,json,os,traceback
          from pypdf import PdfReader
          PAT=os.environ['GH_PAT'];TOK=os.environ.get('TOKEN_AGENT','')
          def get(u,t=180):return ur.urlopen(ur.Request(u,headers={'User-Agent':'x'}),timeout=t).read()
          def tell(t):
              if not TOK:return
              try:ur.urlopen(ur.Request('https://api.telegram.org/bot'+TOK+'/sendMessage',data=json.dumps({'chat_id':'227491135','text':t}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              except Exception:pass
          def commit(path,b):
              body={'message':'pdfimg','content':base64.b64encode(b).decode()}
              try:
                  old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path));body['sha']=old['sha']
              except Exception:pass
              ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path,data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'x','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
          n=0
          try:
              name='LIT & Trap Trading v1 @Trading_Tuts.pdf'
              url='https://raw.githubusercontent.com/Mbms-1356/forexin-site-/main/'+up.quote(name)
              data=get(url)
              rd=PdfReader(io.BytesIO(data))
              for pg in rd.pages:
                  try:
                      for im in pg.images:
                          try:
                              b=im.data
                              if len(b)>8000 and (b[:2]==b'\xff\xd8' or b[:4]==b'\x89PNG'):
                                  commit('media/lit_%d.jpg'%n,b);n+=1
                          except Exception:pass
                          if n>=12:break
                  except Exception:pass
                  if n>=12:break
              tell('🖼 استخراج عکس PDF تمام شد؛ '+str(n)+' تصویر در media/ ذخیره شد.')
          except Exception as e:
              tell('⚠️ خطای استخراج عکس: '+str(e)[:150])
          print('extracted',n)
          PY
