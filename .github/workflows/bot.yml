name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      TOKEN: "8672154032:AAEgSGwR7uXGZsdpxNJvgsXswJ4aHoAYzhE"
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
    steps:
      - name: deps
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          sudo apt-get install -y ffmpeg >/dev/null 2>&1
          pip install pillow >/dev/null 2>&1
      - name: poll and run
        run: |
          curl -s "https://mbms-1356.github.io/forexin-site-/studio.py?v=$(date +%s)" -o studio.py
          python3 - <<'PYEND'
          import json,os,urllib.request as ur,subprocess,base64
          TOK=os.environ['TOKEN'];PAT=os.environ.get('GH_PAT','')
          API='https://api.telegram.org/bot'+TOK
          def get(u,t=30):return ur.urlopen(ur.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read().decode('utf-8','ignore')
          def send(t):
              try:ur.urlopen(ur.Request(API+'/sendMessage',data=json.dumps({'chat_id':'227491135','text':t}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              except Exception:pass
          def commit(path,content):
              try:
                  body={'message':'bot '+path,'content':base64.b64encode(content.encode()).decode()}
                  try:
                      old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path))
                      body['sha']=old.get('sha')
                  except Exception:pass
                  ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path,data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'bot','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
              except Exception:pass
          off=0
          try:off=int(json.loads(get('https://mbms-1356.github.io/forexin-site-/bot_offset.json')).get('off',0))
          except Exception:pass
          try:up=json.loads(get(API+'/getUpdates?offset='+str(off+1),20))
          except Exception:up={'result':[]}
          msgs=up.get('result',[])
          newoff=off
          for m in msgs:newoff=max(newoff,m['update_id'])
          if off==0 and msgs:
              commit('bot_offset.json',json.dumps({'off':newoff}));msgs=[]
          for m in msgs:
              t=(m.get('message') or {}).get('text','')
              if not t:continue
              topic='';text='';img=''
              if t.startswith('/img'):img=t[4:].strip()
              elif t.startswith('/post'):topic=t[5:].strip()
              elif t.startswith('/auto'):topic=''
              else:topic=t.strip()
              send('✅ دستور دریافت شد؛ در حال ساخت بستهٔ «'+(topic or 'تصادفی')+'»…')
              env=dict(os.environ);env['CUSTOM']=json.dumps({'topic':topic,'text':text,'img':img})
              subprocess.run(['python3','studio.py'],env=env,timeout=300)
          if msgs:commit('bot_offset.json',json.dumps({'off':newoff}))
          print('bot done',len(msgs))
          PYEND
