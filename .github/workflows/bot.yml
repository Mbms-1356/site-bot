name: bot
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TOKEN_AGENT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: deps
        run: |
          sudo apt-get update -y >/dev/null 2>&1
          sudo apt-get install -y ffmpeg >/dev/null 2>&1
          pip install pillow pypdf >/dev/null 2>&1
      - name: assistant
        run: |
          curl -s "https://mbms-1356.github.io/forexin-site-/studio.py?v=$(date +%s)" -o studio.py
          python3 - <<'PYEND'
          import json,os,io,re,time,urllib.request as ur,subprocess,base64,zipfile
          TOK=os.environ['TOKEN'];PAT=os.environ.get('GH_PAT','');OR=os.environ.get('OPENROUTER_KEY','');GK=os.environ.get('GROQ_KEY','');EVT=os.environ.get('EVENT','')
          API='https://api.telegram.org/bot'+TOK
          SITE='https://mbms-1356.github.io/forexin-site-'
          def req(u,d=None,t=40):
              return ur.urlopen(ur.Request(API+u,data=d,headers={'Content-Type':'application/json'}),timeout=t).read().decode('utf-8','ignore')
          def get(u,t=40):return ur.urlopen(ur.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read()
          def send(t,kb=None):
              d={'chat_id':'227491135','text':t}
              if kb:d['reply_markup']=kb
              try:req('/sendMessage',json.dumps(d).encode())
              except Exception:pass
          def commit(path,b64,msg):
              body={'message':msg,'content':b64}
              try:
                  old=json.loads(get('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path))
                  body['sha']=old.get('sha')
              except Exception:pass
              try:ur.urlopen(ur.Request('https://api.github.com/repos/Mbms-1356/forexin-site-/contents/'+path,data=json.dumps(body).encode(),headers={'Authorization':'token '+PAT,'User-Agent':'bot','Accept':'application/vnd.github+json'},method='PUT'),timeout=30).read()
              except Exception:pass
          def commit_txt(path,s):commit(path,base64.b64encode(s.encode()).decode(),'bot '+path)
          def commit_bin(path,b):commit(path,base64.b64encode(b).decode(),'bot '+path)
          def state_load():
              try:return json.loads(get(SITE+'/bot_state.json'))
              except Exception:return {}
          def state_save(d):commit_txt('bot_state.json',json.dumps(d))
          models=[]
          if OR:
              try:
                  ml=json.loads(get('https://openrouter.ai/api/v1/models',20))
                  free=[m.get('id','') for m in ml.get('data',[]) if m.get('pricing',{}).get('prompt')=='0' and m.get('pricing',{}).get('completion')=='0']
                  pref=[m for m in free if any(k in m.lower() for k in ['qwen','llama','mistral','deepseek','gemini','alpha'])]
                  models=(pref or free)[:2]
              except Exception:pass
          VISION=['meta-llama/llama-3.2-11b-vision-instruct:free','google/gemma-3-4b-it:free']
          def ask(s,u):
              for m in models:
                  try:
                      r=ur.urlopen(ur.Request('https://openrouter.ai/api/v1/chat/completions',data=json.dumps({'model':m,'messages':[{'role':'user','content':s+'\n'+u}],'max_tokens':1600}).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+OR}),timeout=60).read().decode()
                      c=json.loads(r)['choices'][0]['message']['content']
                      if c:return c
                  except Exception:pass
              if GK:
                  try:
                      r=ur.urlopen(ur.Request('https://api.groq.com/openai/v1/chat/completions',data=json.dumps({'model':'llama-3.3-70b-versatile','messages':[{'role':'user','content':s+'\n'+u}],'max_tokens':1600}).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+GK}),timeout=60).read().decode()
                      return json.loads(r)['choices'][0]['message']['content']
                  except Exception:pass
              return ''
          def read_img_text(b64):
              for vm in VISION:
                  try:
                      body={'model':vm,'messages':[{'role':'user','content':[{'type':'text','text':'متن داخل این تصویر را بخوان و برگردان؛ سپس یک کپشن اینستاگرام احساسی و ۵ هشتگ سئو بر اساس همان متن بنویس.'},{'type':'image_url','image_url':{'url':'data:image/jpeg;base64,'+b64}}]}],'max_tokens':600}
                      r=ur.urlopen(ur.Request('https://openrouter.ai/api/v1/chat/completions',data=json.dumps(body).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+OR}),timeout=60).read().decode()
                      c=json.loads(r)['choices'][0]['message']['content']
                      if c:return c
                  except Exception:pass
              return ''
          def tgfile(fid):
              r=json.loads(req('/getFile?file_id='+fid))
              return ur.urlopen('https://api.telegram.org/file/bot'+TOK+'/'+r['result']['file_path'],timeout=90).read()
          def run_studio(c):
              env=dict(os.environ);env['CUSTOM']=json.dumps(c)
              subprocess.run(['python3','studio.py'],env=env,timeout=300)
          def ingest_text(text):
              text=text[:9000]
              if len(text)<200:return 0
              out=ask('از متن فارکس فقط JSON: {"topics":[۶ موضوع فارسی کوتاه],"quotes":[۴ جمله طلایی/بزرگان],"facts":[۶ نکته],"hooks":[۴ قلاب]}',text)
              out=out.replace('```json','').replace('```','');i=out.find('{');j=out.rfind('}')
              if i<0 or j<=i:return 0
              try:obj=json.loads(out[i:j+1])
              except Exception:return 0
              vault={'principles':[],'quotes':[],'hooks':[],'lit_facts':[]}
              try:vault.update(json.loads(get(SITE+'/vault.json')))
              except Exception:pass
              for t in obj.get('topics',[]):
                  if t not in vault['principles']:vault['principles'].append(t)
              for q in obj.get('quotes',[]):
                  if q not in vault['quotes']:vault['quotes'].append(q)
              for h in obj.get('hooks',[]):
                  if h not in vault['hooks']:vault['hooks'].append(h)
              for f in obj.get('facts',[]):
                  if f not in vault['lit_facts']:vault['lit_facts'].append(f)
              for k in vault:vault[k]=vault[k][-300:]
              commit_txt('vault.json',json.dumps(vault,ensure_ascii=False))
              return len(obj.get('topics',[]))
          def ingest_pdf(data,name,pw=''):
              from pypdf import PdfReader
              rd=PdfReader(io.BytesIO(data))
              if rd.is_encrypted:
                  ok=False
                  for p in [pw,'','1234','12345','123456','password','admin','0000']:
                      try:
                          if rd.decrypt(p):ok=True;break
                      except Exception:pass
                  if not ok:return -1
              text=''
              for pg in rd.pages[:10]:text+=(pg.extract_text() or '')
              cnt=0
              try:
                  ts=int(time.time())
                  for pi,pg in enumerate(rd.pages[:6]):
                      for im in pg.images[:2]:
                          b=im.data
                          if 5000<len(b)<300000:
                              commit_bin('media/pdfimg_%d_%d.jpg'%(ts,cnt),b);cnt+=1
                      if cnt>=2:break
              except Exception:pass
              return ingest_text(text)
          def read_docx(data):
              z=zipfile.ZipFile(io.BytesIO(data))
              x=z.read('word/document.xml').decode('utf-8','ignore')
              x=x.replace('</w:p>','\n')
              x=re.sub(r'<[^>]+>',' ',x)
              return x
          def read_txt(data):
              for enc in ['utf-8','cp1256','latin-1']:
                  try:return data.decode(enc)
                  except Exception:pass
              return ''
          def read_rtf(data):
              s=data.decode('latin-1','ignore')
              s=re.sub(r'\\[a-z]+-?\d* ?','',s)
              s=re.sub(r'[{}]','',s)
              return s
          MENU={'keyboard':[['📦 بسته کامل','🎲 پست از مخزن'],['🖼 ساخت عکس','✍️ نوشتن کپشن'],['🎬 ساخت ریلز','📚 افزودن PDF'],['🖼 آپلود عکس','💰 قیمت روز'],['❓ راهنما']],'resize_keyboard':True}
          try:req('/deleteWebhook',b'{}')
          except Exception:pass
          off=0
          try:off=int(json.loads(get(SITE+'/bot_offset.json')).get('off',0))
          except Exception:pass
          up={'result':[]}
          try:up=json.loads(req('/getUpdates?offset='+str(off+1)+'&timeout=5'))
          except Exception as e:send('🛠 خطای ربات: '+str(e)[:80])
          now=int(time.time());allm=up.get('result',[])
          msgs=[m for m in allm if (m.get('message') or {}).get('date',0)>now-1800 and str((m.get('message') or {}).get('chat',{}).get('id',''))=='227491135']
          newoff=off
          for m in allm:newoff=max(newoff,m['update_id'])
          if newoff>off:commit_txt('bot_offset.json',json.dumps({'off':newoff}))
          if not msgs and EVT=='workflow_dispatch':send('🤖 آنلاینم؛ فرمانی نیست.',MENU)
          for m in msgs:
            msg=m.get('message') or {}
            t=msg.get('text','')
            try:
              st0=state_load()
              if st0.get('pending_pdf') and t and not t.startswith('/'):
                  data=tgfile(st0['pending_pdf'])
                  n=ingest_pdf(data,st0.get('pending_name',''),pw=t)
                  st0.pop('pending_pdf',None);st0.pop('pending_name',None);state_save(st0)
                  if n>=0:send('✅ رمز درست بود؛ به کتابخانه اضافه شد؛ +'+str(n)+' موضوع.')
                  else:send('❌ رمز اشتباه است؛ PDF را دوباره بفرست.')
                  continue
              if t=='/start' or t=='❓ راهنما':
                  send('🦁 دستیار فارکسین:\n📦 بسته کامل | 🎲 پست از مخزن\n🖼 عکس | ✍️ کپشن | 🎬 ریلز\n📚 PDF/Word/TXT = کتابخانه + استخراج عکس\n🖼 عکس بفرست = کاور + خواندن متنِ عکس برای کپشن/سئو\n💰 قیمت روز',MENU)
              elif t=='/price' or t=='💰 قیمت روز':
                  usdt=0;oz=0
                  try:usdt=int(json.loads(get(SITE+'/price.json')).get('usdt',0))
                  except Exception:pass
                  try:oz=float(json.loads(get('https://api.gold-api.com/price/XAU',10)).get('price',0))
                  except Exception:pass
                  send('💹 تتر: '+str(usdt)+' تومان\n🪙 انس: '+str(oz)+' دلار')
              elif t=='/auto' or t=='🎲 پست از مخزن':
                  send('🎲 در حال ساخت از مخزن…');run_studio({'mode':'full'})
              elif t=='📦 بسته کامل' or t=='📝 پست جدید':
                  st=state_load();st['mode']='full';state_save(st);send('موضوع را بنویس:')
              elif t=='🖼 ساخت عکس':
                  st=state_load();st['mode']='img';state_save(st);send('موضوع را بنویس تا فقط عکس بسازم:')
              elif t=='✍️ نوشتن کپشن':
                  st=state_load();st['mode']='cap';state_save(st);send('موضوع را بنویس تا فقط کپشن بنویسم:')
              elif t=='🎬 ساخت ریلز':
                  st=state_load();st['mode']='vid';state_save(st);send('موضوع را بنویس تا فقط ریلز بسازم:')
              elif t=='📚 افزودن PDF':
                  send('فایل (PDF/Word/TXT) را همین‌جا بفرست:')
              elif t=='🖼 آپلود عکس':
                  send('عکس را همین‌جا بفرست:')
              elif msg.get('document'):
                  doc=msg['document'];name=(doc.get('file_name') or '').lower()
                  send('📚 دریافت شد؛ در حال خواندن…')
                  data=tgfile(doc['file_id'])
                  if name.endswith('.pdf'):
                      n=ingest_pdf(data,doc.get('file_name',''))
                      if n==-1:
                          st=state_load();st['pending_pdf']=doc['file_id'];st['pending_name']=doc.get('file_name','');state_save(st)
                          send('🔒 این PDF رمز دارد؛ رمز را بفرست:')
                      elif n>0:send('✅ به کتابخانه اضافه شد؛ +'+str(n)+' موضوع (+عکس‌های PDF استخراج شد).')
                      else:send('⚠️ این PDF متن قابل‌خواندن ندارد (اسکن/تصویر است)؛ فقط عکس‌هایش استخراج شد.')
                  elif name.endswith('.docx'):
                      send('✅ Word خوانده شد؛ +'+str(ingest_text(read_docx(data)))+' موضوع.')
                  elif name.endswith('.txt'):
                      send('✅ TXT خوانده شد؛ +'+str(ingest_text(read_txt(data)))+' موضوع.')
                  elif name.endswith('.rtf'):
                      send('✅ RTF خوانده شد؛ +'+str(ingest_text(read_rtf(data)))+' موضوع.')
                  else:send('فقط PDF / Word / TXT بفرست.')
              elif msg.get('photo'):
                  ph=msg['photo'][-1]
                  data=tgfile(ph['file_id'])
                  fn='media/img_%d.jpg'%int(time.time())
                  commit_bin(fn,data)
                  st=state_load();st['photo']=SITE+fn;state_save(st)
                  cap=read_img_text(base64.b64encode(data).decode())
                  if cap:
                      st=state_load();st['text']=cap;state_save(st)
                      send('🖼 عکس ذخیره شد؛ متنِ عکس خوانده شد و برای کپشن/سئو استفاده می‌شود:\n'+cap[:300])
                  else:
                      send('🖼 عکس ذخیره شد؛ پست بعدی با همین عکس (۱ دقیقه بعد).')
              elif msg.get('video'):
                  send('🎬 ویدیو دریافت شد؛ به‌دلیل محدودیت حجم، لینکش را دستی بگذار.')
              elif t.startswith('/img'):
                  send('✅ در حال ساخت با تصویر دلخواه…');run_studio({'img':t[4:].strip(),'mode':'full'})
              elif t.startswith('/post'):
                  st=state_load();img=st.get('photo','');txtv=st.get('text','');st.pop('photo',None);st.pop('text',None);state_save(st)
                  send('✅ در حال ساخت «'+t[5:].strip()+'»…');run_studio({'topic':t[5:].strip(),'img':img,'text':txtv,'mode':'full'})
              elif t.startswith('/'):continue
              else:
                  st=state_load();img=st.get('photo','');txtv=st.get('text','');mode=st.pop('mode','full')
                  if img:st.pop('photo',None)
                  if txtv:st.pop('text',None)
                  state_save(st)
                  send('✅ در حال ساخت…');run_studio({'topic':t.strip(),'img':img,'text':txtv,'mode':mode})
            except Exception as e:
              send('⚠️ خطا: '+str(e)[:100])
          print('bot done',len(msgs))
          PYEND
